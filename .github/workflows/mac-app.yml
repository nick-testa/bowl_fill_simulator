# Builds "Bowl Fill Simulator.app" for macOS (Apple Silicon and Intel in one app).
#
#   - Actions tab -> "Mac app" -> Run workflow: the zip appears under the run's
#     Artifacts (GitHub wraps it in a second zip; unzip once and send the inner one).
#   - Push a tag like v1.3: the zip is also attached to a GitHub Release of that name.
name: Mac app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write  # to create the release on a tag

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe stamps the bundled menus

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ./build/bowlfill-verify

      - name: Bundle Qt into the app
        run: |
          macdeployqt "build/Bowl Fill Simulator.app"
          # Not notarised, but Apple Silicon refuses to run anything unsigned.
          codesign --force --deep --sign - "build/Bowl Fill Simulator.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Bowl Fill Simulator.app" BowlFillSimulator-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BowlFillSimulator-mac
          path: BowlFillSimulator-mac.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" BowlFillSimulator-mac.zip --generate-notes
